<header class="page-header{% if bordered %} page-header--bordered{% endif %}">
    {% if eyebrow %}
    <span class="page-header__eyebrow">{{ eyebrow }}</span>
    {% endif %}
    <h1 class="page-header__title">{{ title }}</h1>
    {% if subtitle %}
    <p class="page-header__subtitle{% if subtitle_uppercase %} page-header__subtitle--uppercase{% endif %}">{{ subtitle }}</p>
    {% endif %}
    {% if count is not None %}
    <span class="page-header__count">{{ count }}</span>
    {% endif %}
    {% if divider %}
    <div class="page-header__divider" aria-hidden="true"></div>
    {% endif %}
    {% if action %}
    <div class="page-header__action">{{ action }}</div>
    {% endif %}
</header>

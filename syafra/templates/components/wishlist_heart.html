<button class="wishlist-btn{% if product.pk in wishlisted_ids %} is-wishlisted{% endif %}"
        type="button"
        data-product-id="{{ product.pk }}"
        aria-label="{% if product.pk in wishlisted_ids %}Remove from Wishlist{% else %}Add to Wishlist{% endif %}"
        aria-pressed="{% if product.pk in wishlisted_ids %}true{% else %}false{% endif %}">
    <svg class="wishlist-btn__icon" viewBox="0 0 24 24" width="20" height="20" fill="{% if product.pk in wishlisted_ids %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
</button>

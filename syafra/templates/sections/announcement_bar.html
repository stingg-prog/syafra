{% load static %}
{% with config=section.config ds=section.device_settings %}
{% if config.text %}
<div class="announcement-bar" id="announcement-bar" role="banner" aria-label="Announcement"
     style="{% if config.bg_color %}background-color: {{ config.bg_color }};{% endif %} {% if config.text_color %}color: {{ config.text_color }};{% endif %}">
    <div class="announcement-content">
        <div class="announcement-block">
            {% if config.link_url %}
            <a href="{{ config.link_url }}" style="color: inherit; text-decoration: none;">
                <span class="announcement-text">{{ config.text }}</span>
            </a>
            {% else %}
            <span class="announcement-text">{{ config.text }}</span>
            {% endif %}
        </div>
    </div>
    <button class="announcement-close" aria-label="Dismiss announcement" id="announcement-close">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
</div>
{% endif %}
{% endwith %}

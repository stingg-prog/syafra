{% load static %}
{% with config=section.config %}
<section class="promo-banner" style="background-color: {{ config.bg_color|default:'#E8DCC4' }};">
    <div class="promo-banner__inner">
        <div class="promo-banner__content reveal">
            {% if config.headline %}
            <span class="promo-banner__overline">Featured</span>
            <h2 class="promo-banner__headline" style="color: {{ config.text_color|default:'#000000' }};">{{ config.headline }}</h2>
            {% endif %}
            {% if config.description %}
            <p class="promo-banner__text" style="color: {{ config.text_color|default:'#000000' }};">
                {{ config.description }}
            </p>
            {% endif %}
            {% if config.button_text %}
            <div>
                <a href="{{ config.button_url|default:'/shop/' }}" class="promo-banner__btn promo-banner__btn-primary">
                    {{ config.button_text }}
                </a>
            </div>
            {% endif %}
        </div>
        <div class="promo-banner__image">
            <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1200&q=80" alt="Featured Collection" loading="lazy" decoding="async">
        </div>
    </div>
</section>
{% endwith %}

{% load static %}
<section class="newsletter-section"{% if section.bg_color %} style="background-color: {{ section.bg_color }};"{% endif %}>
    <div class="newsletter-inner reveal">
        <span class="newsletter-overline">Newsletter</span>
        <h2 class="newsletter-title">Stay in the Loop</h2>
        <p class="newsletter-text">
            Subscribe for exclusive drops, styling tips, and early access to new collections.
        </p>
        <form id="newsletter-form"
              action="{% url 'products:newsletter_subscribe' %}"
              method="post"
              onsubmit="return window.submitNewsletter(event)"
              class="newsletter-form"
              aria-busy="false">
            {% csrf_token %}
            <div class="newsletter-input-wrapper">
                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required
                       class="newsletter-input"
                       aria-label="Email address"
                       id="newsletter-email">
            </div>
            <button type="submit" class="newsletter-btn" id="newsletter-submit">
                <span class="newsletter-btn__text">Subscribe</span>
                <span class="newsletter-spinner"></span>
            </button>
        </form>
        <p id="newsletter-message" class="newsletter-message hidden" aria-live="polite"></p>
        {% if messages %}
        <div class="newsletter-message is-success">
            {% for message in messages %}{{ message }}{% endfor %}
        </div>
        {% endif %}
    </div>
</section>

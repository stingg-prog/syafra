{% load static security_filters %}
{% with config=section.config %}
<section class="custom-html-section"{% if section.bg_color %} style="background-color: {{ section.bg_color }};"{% endif %}>
  {% if config.custom_html %}
  {{ config.custom_html|sanitize }}
  {% else %}
  <p class="section-empty">No custom HTML content.</p>
  {% endif %}
</section>
{% endwith %}
